name: rag-vet
description: Scan documents for hidden instructions, exfiltration links, secrets and personal data before they enter a RAG index.
author: Osama Wehbi
branding:
  icon: shield
  color: red

inputs:
  args:
    description: >
      Inputs passed to `rag-vet scan`, for example `docs/ --lock rag-vet.lock --exclude 'docs/archive/*'`.
      Do not include --format or --output; use the inputs below.
    required: true
  fail-on:
    description: Fail the step when a finding is at or above this severity (high, medium, low, info or none).
    default: high
  sarif:
    description: Where to write the SARIF report. Upload it with github/codeql-action/upload-sarif.
    default: rag-vet.sarif
  python-version:
    description: Python version used to run rag-vet.
    default: "3.12"

outputs:
  sarif:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install rag-vet
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - name: Run rag-vet
      shell: bash
      env:
        RAG_VET_ARGS: ${{ inputs.args }}
        RAG_VET_FAIL_ON: ${{ inputs.fail-on }}
        RAG_VET_SARIF: ${{ inputs.sarif }}
      # Inputs are passed through environment variables, never interpolated into the script,
      # so a malicious input cannot inject shell commands.
      run: |
        read -r -a args <<< "$RAG_VET_ARGS"
        rag-vet scan "${args[@]}" \
          --format sarif --output "$RAG_VET_SARIF" \
          --fail-on "$RAG_VET_FAIL_ON" \
          --summary "$GITHUB_STEP_SUMMARY"
